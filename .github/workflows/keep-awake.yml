# The free Render server sleeps after 15 idle minutes and then takes about a minute to wake.
# A visit to /health every 10 minutes keeps the live app awake for the judges.
name: keep the live app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the health page
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://fixscribe-wpf3.onrender.com/health
