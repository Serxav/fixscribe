{% extends "base.html" %}
{% block title %}FixScribe{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-2">FixScribe</h2>
<p class="mb-6">Film a repair. Get a step-by-step guide.</p>
<form action="/upload" method="post" enctype="multipart/form-data" class="flex flex-col gap-4">
<label class="block font-medium" for="video">Repair video</label>
<input id="video" type="file" name="video" accept="video/*" capture="environment" required
class="block w-full border border-slate-300 p-3 min-h-[48px]">
<button type="submit" class="w-full bg-slate-900 text-white font-semibold py-4 min-h-[48px]">
Upload the repair video
</button>
</form>
<p class="mt-4 text-sm">Narrate with 'step one', 'step two'… for the best cuts. Silent videos work too.</p>
{% endblock %}
