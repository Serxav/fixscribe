{% extends "base.html" %}
{% block title %}FixScribe job {{ job_id }}{% endblock %}
{% block content %}
<div id="job" data-job-id="{{ job_id }}">
<h2 class="text-2xl font-semibold mb-1">Turning your video into a guide…</h2>
<p class="text-sm mb-4">Job {{ job_id }}</p>
<div class="w-full bg-slate-200 h-4" role="progressbar" aria-label="job progress">
<div id="progress-bar" class="bg-slate-900 h-4" style="width: 0%"></div>
</div>
<p id="stage-label" class="mt-3 font-medium">{{ status.stage or "Starting" }}</p>
<p id="state-label" class="text-sm">{{ status.state }}</p>
<p id="error" class="mt-3 text-sm text-red-700">{{ status.error or "" }}</p>
<a id="guide-link" href="/guides/{{ job_id }}"
class="hidden mt-4 block text-center bg-slate-900 text-white font-semibold py-4 min-h-[48px]">Open the guide</a>
<a id="retry-link" href="/"
class="hidden mt-4 block text-center border border-slate-900 font-semibold py-4 min-h-[48px]">Try another video</a>
</div>
<script src="/static/job.js"></script>
{% endblock %}
