<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FixScribe{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header">
<div class="page" style="padding-top:0;padding-bottom:0;">
<a class="wordmark" href="/">FixScribe</a>
</div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
{% block footer %}<footer class="footer-note caption">Made with FixScribe — Muse Spark, Muse Voice and SAM 3.1 by Meta.</footer>{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
