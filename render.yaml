# Render Blueprint: the free web service the judges open (https, built from the Dockerfile).
# The free instance has 512 MB: it shows the sample guide and its live coach, with the browser's
# own voice; processing a new video needs more memory, so uploads are off (UPLOADS=false).
services:
  - type: web
    name: fixscribe
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false # typed in Render's panel, never in the repository
      - key: DEMO_JOB
        value: 137c1ed0730d,7628d7064780,0e2b78efccb9,359ba5a7fa66
      - key: TRUST_PROXY
        value: "true"
      - key: BUDGET_USD
        value: "30"
      - key: JOB_BUDGET_USD
        value: "2.5"
      - key: DAILY_JOB_LIMIT
        value: "30"
      - key: MAX_RUNNING_JOBS
        value: "1"
      - key: PIPELINE_WORKERS
        value: "1"
      - key: MAX_VIDEO_SECONDS
        value: "120"
      - key: LIVE_BUDGET_USD
        value: "15"
      - key: LIVE_MAX_CALLS
        value: "10000"
      - key: ENABLE_INSPECTOR
        value: "true"
      - key: UPLOADS
        value: "false" # 512 MB is not enough to turn a video into a guide
      - key: VOICE_MODEL_DIR
        value: models/off
