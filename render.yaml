# Render Blueprint: the web service the judges open (https, built from the Dockerfile).
# Standard (2 GB): turning a video into a guide peaks at about 690 MB, more than the free 512 MB.
services:
  - type: web
    name: fixscribe
    runtime: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false # typed in Render's panel, never in the repository
      - key: DEMO_JOB
        value: 137c1ed0730d,7628d7064780,0e2b78efccb9,359ba5a7fa66
      - key: TRUST_PROXY
        value: "true"
      - key: BUDGET_USD
        value: "30"
      - key: JOB_BUDGET_USD
        value: "2.5"
      - key: DAILY_JOB_LIMIT
        value: "30"
      - key: MAX_RUNNING_JOBS
        value: "1"
      - key: PIPELINE_WORKERS
        value: "1"
      - key: MAX_VIDEO_SECONDS
        value: "120"
      - key: LIVE_BUDGET_USD
        value: "15"
      - key: LIVE_MAX_CALLS
        value: "10000"
      - key: ENABLE_INSPECTOR
        value: "true"
      - key: UPLOADS
        value: "true"
      - key: VOICE_MODEL_DIR
        value: models/off
