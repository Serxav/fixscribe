# Render Blueprint: the free web service the judges open (https, built from the Dockerfile).
# 512 MB shows the finished guides and the live coach; turning a new video into a guide needs more
# (about 690 MB), so uploads are off here and run on the judge's own computer.
services:
  - type: web
    name: fixscribe
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false # typed in Render's panel, never in the repository
      - key: DEMO_JOB
        value: 137c1ed0730d,7628d7064780,0e2b78efccb9,359ba5a7fa66
      - key: TRUST_PROXY
        value: "true"
      - key: BUDGET_USD
        value: "50" # the live app stops every Meta call past $50 in all
      - key: JOB_BUDGET_USD
        value: "10"
      - key: DAILY_JOB_LIMIT
        value: "30"
      - key: MAX_RUNNING_JOBS
        value: "1"
      - key: PIPELINE_WORKERS
        value: "1"
      - key: MAX_VIDEO_SECONDS
        value: "120"
      - key: LIVE_BUDGET_USD
        value: "15"
      - key: LIVE_MAX_CALLS
        value: "10000"
      - key: ENABLE_INSPECTOR
        value: "true"
      - key: UPLOADS
        value: "false"
